[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-expressivity-engineering"
version = "0.1.0"
description = "Qwen3 single-layer RL and FFN expressivity research infrastructure."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/Jacob-o-TING/qwen3_1p7b_single_layer_rl_expressivity_engineering"
Issues = "https://github.com/Jacob-o-TING/qwen3_1p7b_single_layer_rl_expressivity_engineering/issues"

[project.entry-points."vllm.general_plugins"]
qwen_single_layer_rl_shs = "qwen_single_layer_rl.vllm.shs_plugin:register"
qwen_single_layer_rl_triglu = "qwen_single_layer_rl.vllm.triglu_plugin:register"
qwen_single_layer_rl_oft = "qwen_single_layer_rl.vllm.oft_plugin:register"

[project.optional-dependencies]
dev = ["pyyaml>=6.0"]
grpo = ["math-verify==0.9.0"]
full = [
  "pyyaml>=6.0",
  "torch",
  "transformers>=4.51.0",
  "datasets",
  "accelerate",
]

[tool.setuptools.packages.find]
where = ["src"]
