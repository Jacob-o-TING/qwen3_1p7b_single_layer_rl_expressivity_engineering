# Human-readable map for the veRL command generated by
# qwen_single_layer_rl.training.verl_command. The active architecture-variant
# wave uses patched veRL v0.6.1 with synchronous HF rollout.
algorithm:
  adv_estimator: grpo
data:
  train_files: data/numina_math_cot_50k_decontam_v3/train.parquet
  val_files: data/numina_math_cot_50k_decontam_v3/val.parquet
  train_batch_size: 512
  max_prompt_length: 1024
  max_response_length: 3072
  shuffle: true
  seed: 20260707
actor_rollout_ref:
  model:
    path: Qwen/Qwen3-1.7B-Base
  actor:
    optim:
      lr: 5.0e-6
    ppo_mini_batch_size: 128
    ppo_micro_batch_size: 8
    data_loader_seed: 20260707
    shuffle: true
  rollout:
    n: 4
    name: hf
    mode: sync
    top_k: 0
    tensor_model_parallel_size: 1
    max_num_seqs: 64
    gpu_memory_utilization: 0.85
    max_num_batched_tokens: 131072
trainer:
  total_epochs: 4
  n_gpus_per_node: 4
  nnodes: 1
  project_name: qwen3_single_layer_rl
  experiment_name: qwen3_1p7b_layer10_grpo
custom:
  freeze_policy:
    train_layers:
      - 10
    freeze_embeddings: true
    freeze_lm_head: true
  architecture_variant:
    name: identity
